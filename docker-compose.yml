services:
  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      APP_DB_PATH: /data/pathology.sqlite3
      # 默认接收方。网页上可切换到 receiver-b（http://localhost:8002 → 容器内 receiver-b:8000）。
      RECEIVER_URL: http://receiver-a:8000
      RECONCILE_ON_START: "1"
    volumes:
      - app-data:/data
    depends_on:
      - receiver-a
      - receiver-b
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  receiver-a:
    build: .
    command: uvicorn receiver.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    environment:
      RECEIVER_DB_PATH: /data/receiver.sqlite3
      RECEIVER_NAME: receiver-a
      RECEIVER_DECISION: accept
      RECEIVER_FAULT: none
    volumes:
      - receiver-a-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  receiver-b:
    build: .
    command: uvicorn receiver.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8002:8000"
    environment:
      RECEIVER_DB_PATH: /data/receiver.sqlite3
      RECEIVER_NAME: receiver-b
      RECEIVER_DECISION: accept
      RECEIVER_FAULT: none
    volumes:
      - receiver-b-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-data:
  receiver-a-data:
  receiver-b-data:
